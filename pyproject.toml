[project]
name = "skyflow"
version = "0.1.0"
description = "Flight operations ELT pipeline: BTS on-time data -> Postgres star schema -> ML features"
requires-python = ">=3.11"

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 110
target-version = "py311"
extend-exclude = ["logs", "data"]

[tool.ruff.lint]
# pyflakes, pycodestyle, isort, bugbear, pyupgrade
select = ["F", "E", "W", "I", "B", "UP"]

[tool.ruff.lint.per-file-ignores]
# Airflow injects context values (ds, run_id) into TaskFlow params whose default is None.
"dags/*" = ["RUF013"]
# Inline CSS/HTML template strings read better unwrapped.
"dashboard/*" = ["E501"]
