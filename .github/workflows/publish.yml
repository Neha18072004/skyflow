name: Publish marts

# Manual only: the source is a fixed historical quarter (Jan-Mar 2024), so a scheduled run would
# republish identical numbers, and a partial slice would overwrite the full-quarter marts.
# Each run rebuilds the warehouse from scratch, which doubles as a reproducibility check.
on:
  workflow_dispatch:

jobs:
  rebuild-and-publish:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: skyflow
          POSTGRES_PASSWORD: skyflow
          POSTGRES_DB: skyflow
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U skyflow"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      PYTHONPATH: src
      SKYFLOW_DB_URL: postgresql+psycopg2://skyflow:skyflow@localhost:5432/skyflow
      CLOUD_DATABASE_URL: ${{ secrets.CLOUD_DATABASE_URL }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: pip install -r requirements.txt

      # BTS files never change for a past month, so cache them between runs.
      - name: Cache raw BTS data
        uses: actions/cache@v4
        with:
          path: data/raw
          key: bts-raw-2024-01-03-${{ hashFiles('scripts/download_data.sh') }}

      - name: Download raw data (Jan-Mar 2024)
        run: scripts/download_data.sh 2024 1 3

      - name: Create warehouse schema
        run: python -c "from skyflow.db import apply_schema; apply_schema()"

      - name: Run pipeline for every day
        run: python -m skyflow.pipeline --start 2024-01-01 --end 2024-03-31

      - name: Build marts and publish to cloud
        run: |
          test -n "$CLOUD_DATABASE_URL" || { echo "CLOUD_DATABASE_URL secret is not set"; exit 1; }
          python -m skyflow.publish
